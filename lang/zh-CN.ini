# LiteCap 简体中文语言包
# 格式：key=value，UTF-8 编码，以 # 或 ; 开头的行为注释

_name=简体中文

app_subtitle=极简离线录屏

# ---- 主窗口 ----
target=录制目标
target_all=整个桌面（所有显示器）
target_monitor=显示器
target_region=自定义区域
target_window=窗口
target_window_off=（未运行）
pick_region=框选区域…
pick_window=选择窗口…

fps=帧率
quality=画质
quality_high=高（清晰，文件较大）
quality_medium=中（均衡）
quality_low=低（省空间）
encoder=编码器
enc_opt_auto=自动（优先硬件）
enc_opt_hardware=硬件编码（NVIDIA/AMD/Intel）
enc_opt_software=软件编码（CPU）
audio_system=录制系统声音
audio_microphone=录制麦克风
err_audio_system=系统声音采集启动失败，请检查默认输出设备和 Windows 音频服务。
err_audio_microphone=麦克风采集启动失败，请检查输入设备连接及 Windows 麦克风隐私权限。

language=语言

output_dir=保存位置
browse=浏览…

# ---- 快捷键 ----
hotkey=快捷键
hotkey_set=设置…
hotkey_none=未设置
hotkey_capture_hint=请按下要使用的单键或组合键
hotkey_capture_sub=支持 F8 等单键；Esc 取消，Backspace / Delete 清除
hotkey_fail=这个组合已被其他程序占用，请换一个。
hotkey_cleared=快捷键已清除。

# ---- 编码器 / 捕获方式（录制时显示在录制按钮上）----
enc_gpu=GPU 编码
enc_cpu=CPU 编码
# 选的是「窗口」，但那个窗口没有标题栏，Windows 的窗口捕获接口不支持它，
# 于是退回了抓屏幕区域。会显示在录制按钮上，让用户知道遮挡会进画面。
cap_region=区域模式

start=开始录制
stop=停止录制
float_mode=悬浮窗模式

# ---- 录制记录 ----
history=录制记录
history_hint=Ctrl 多选，Shift 连选；双击播放，右键操作。
col_name=文件名
col_duration=时长
col_size=大小

# ---- 右键菜单 ----
menu_play=在软件中播放
menu_open_dir=打开所在目录
menu_copy_path=复制完整路径
menu_remove=从列表移除
menu_delete_file=删除文件

# ---- 悬浮窗 ----
bar_start=开始
bar_stop=停止

# ---- 区域框选 ----
sel_hint=按住鼠标左键拖动选择录制区域，按 Esc 取消

# ---- 提示与错误 ----
confirm_delete=确定要删除这个录像文件吗？此操作不可撤销。
confirm_delete_many=确定要删除选中的 %u 个录像文件吗？此操作不可撤销。
err_delete_files=%u 个文件未能删除，已保留在录制记录中。
tray_show=打开 LiteCap
tray_close_action=关闭动作
close_to_tray=最小化到托盘
close_exit=直接退出
tray_exit=退出
err_tray=无法创建托盘图标，窗口已保持打开。请稍后重试。
err_no_region=还没有框选录制区域，请先点击「框选区域…」。
err_no_window=所选的那个窗口已经关掉了，请重新选一个。
err_start=无法开始录制，请检查保存位置是否可写。
err_missing=文件不存在，可能已被移动或删除。
failed=录制失败
