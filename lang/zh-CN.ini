# LiteCap 简体中文语言包
# 格式：key=value，UTF-8 编码，以 # 或 ; 开头的行为注释

_name=简体中文

app_subtitle=极简离线录屏

# ---- 主窗口 ----
target=录制目标
target_all=整个桌面（所有显示器）
target_monitor=显示器
target_region=自定义区域
pick_region=框选区域…

fps=帧率
quality=画质
quality_high=高（清晰，文件较大）
quality_medium=中（均衡）
quality_low=低（省空间）

language=语言

output_dir=保存位置
browse=浏览…

start=开始录制
stop=停止录制
float_mode=悬浮窗模式

# ---- 录制记录 ----
history=录制记录
history_hint=双击列表项可在软件内播放，右键可打开所在目录、复制路径、删除。
col_name=文件名
col_duration=时长
col_size=大小
col_time=录制时间

# ---- 右键菜单 ----
menu_play=在软件中播放
menu_open_dir=打开所在目录
menu_copy_path=复制完整路径
menu_remove=从列表移除
menu_delete_file=删除文件

# ---- 悬浮窗 ----
bar_start=开始
bar_stop=停止

# ---- 区域框选 ----
sel_hint=按住鼠标左键拖动选择录制区域，按 Esc 取消

# ---- 提示与错误 ----
confirm_delete=确定要删除这个录像文件吗？此操作不可撤销。
err_no_region=还没有框选录制区域，请先点击「框选区域…」。
err_start=无法开始录制，请检查保存位置是否可写。
err_missing=文件不存在，可能已被移动或删除。
failed=录制失败
